<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Duck Ninja: Blood & Feathers</title>
    <style>
        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
            touch-action: none;
        }
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background: #050505;
            color: #fff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        #game-container {
            position: relative;
            width: 100vw;
            height: 100vh;
            max-width: 1000px;
            max-height: 1000px;
            background: #090a10;
            box-shadow: 0 0 50px rgba(139, 0, 0, 0.8);
            overflow: hidden;
        }
        @media (min-width: 600px) and (min-height: 600px) {
            #game-container {
                width: 95vw;
                height: 95vh;
                border: 3px solid #660000;
                border-radius: 12px;
            }
        }
        canvas {
            display: block;
            width: 100%;
            height: 100%;
        }
        #ui {
            position: absolute;
            top: 20px;
            left: 20px;
            font-size: clamp(22px, 4.5vw, 36px);
            font-weight: 900;
            pointer-events: none;
            text-shadow: 3px 3px 8px rgba(0,0,0,0.9);
            letter-spacing: 2px;
            z-index: 5;
        }
        
        #game-over-screen {
            display: none;
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle, rgba(140, 0, 0, 0.7) 0%, rgba(0, 0, 0, 0.98) 85%);
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 10;
            padding: 20px;
            text-align: center;
        }

        #scary-title {
            font-size: clamp(42px, 9vw, 80px);
            color: #ff0000;
            margin: 0 0 10px 0;
            text-transform: uppercase;
            font-weight: 900;
            letter-spacing: 4px;
            text-shadow: 0 0 20px #ff0000, 0 0 40px #8b0000;
            animation: pulse-glitch 1.2s infinite alternate;
        }

        #scary-subtitle {
            font-size: clamp(14px, 3vw, 20px);
            color: #bbb;
            font-style: italic;
            margin-bottom: 25px;
            letter-spacing: 2px;
        }

        #final-score-container {
            font-size: clamp(22px, 4.5vw, 32px);
            margin-bottom: 30px;
            color: #eee;
        }

        #final-score {
            color: #ff3333;
            font-weight: bold;
            font-size: 1.3em;
        }

        .btn-group {
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
            justify-content: center;
        }

        .btn {
            background: #4a0000;
            color: #ffcccc;
            border: 2px solid #ff0000;
            padding: 14px 32px;
            font-size: clamp(16px, 3.5vw, 20px);
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 1px;
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.2s ease-in-out;
            box-shadow: 0 0 15px rgba(255, 0, 0, 0.4);
        }

        .btn:active {
            transform: scale(0.92);
            background: #ff0000;
            color: #000;
        }

        #blood-overlay {
            pointer-events: none;
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            box-shadow: inset 0 0 140px rgba(255, 0, 0, 0.95);
            opacity: 0;
            transition: opacity 0.2s;
            z-index: 4;
        }

        @keyframes pulse-glitch {
            0% { transform: scale(1); text-shadow: 0 0 20px #ff0000; }
            100% { transform: scale(1.04) skewX(1deg); text-shadow: 0 0 35px #ff0000, 0 0 10px #ffffff; }
        }
    </style>
</head>
<body>

<div id="game-container">
    <div id="ui">SCORE: <span id="score">0</span></div>
    <div id="blood-overlay"></div>
    
    <div id="game-over-screen">
        <h1 id="scary-title">SLAUGHTERED</h1>
        <div id="scary-subtitle">THE DEMON DUCK CLAIMED YOUR FLESH...</div>
        <div id="final-score-container">FINAL SCORE: <span id="final-score">0</span></div>
        <div class="btn-group">
            <button class="btn" onclick="restartGame()">RETRY</button>
            <button class="btn" onclick="shareScore()">SHARE SCORE</button>
        </div>
    </div>

    <canvas id="canvas"></canvas>
</div>

<script>
const container = document.getElementById('game-container');
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');
const scoreEl = document.getElementById('score');
const finalScoreEl = document.getElementById('final-score');
const gameOverScreen = document.getElementById('game-over-screen');
const bloodOverlay = document.getElementById('blood-overlay');

let score = 0;
let gameOver = false;
let ducks = [];
let slicedHalves = [];
let particles = [];
let bladeSparks = [];
let splatters = [];
let bladeTrail = [];
let floatingTexts = [];
let shakeTime = 0;
let spawnTimer = 0;

function resizeCanvas() {
    canvas.width = container.clientWidth;
    canvas.height = container.clientHeight;
}
window.addEventListener('resize', resizeCanvas);
resizeCanvas();

// --- ENHANCED DUCK TYPES & RENDERING ---
class Duck {
    constructor() {
        this.radius = Math.max(30, canvas.width * 0.05);
        this.x = Math.random() * (canvas.width - this.radius * 2) + this.radius;
        this.y = canvas.height + this.radius;
        
        // Dynamic Launch Trajectories
        const targetX = canvas.width / 2 + (Math.random() * (canvas.width * 0.6) - canvas.width * 0.3);
        this.vx = (targetX - this.x) / (Math.random() * 10 + 40);
        this.vy = -(Math.random() * (canvas.height * 0.009) + canvas.height * 0.02);
        this.gravity = canvas.height * 0.00045;
        
        this.rotation = 0;
        this.vRot = (Math.random() - 0.5) * 0.12;
        
        // Randomize Duck Types
        const rand = Math.random();
        if (rand < 0.18) {
            this.type = 'BOMB';
        } else if (rand < 0.28) {
            this.type = 'GOLDEN';
            this.vy *= 1.25; // Golden ducks are fast!
        } else if (rand < 0.40) {
            this.type = 'ZOMBIE';
            this.health = 2; // Requires 2 hits
        } else {
            this.type = 'NORMAL';
        }
    }

    update() {
        this.x += this.vx;
        this.y += this.vy;
        this.vy += this.gravity;
        this.rotation += this.vRot;

        // Aura particles for Golden & Bomb ducks
        if (this.type === 'GOLDEN' && Math.random() < 0.4) {
            bladeSparks.push(new BladeSpark(this.x + (Math.random() - 0.5) * this.radius, this.y + (Math.random() - 0.5) * this.radius, '#ffd700'));
        } else if (this.type === 'BOMB' && Math.random() < 0.5) {
            particles.push(new Particle(this.x, this.y, '#ff1100', 0.5));
        }
    }

    draw() {
        ctx.save();
        ctx.translate(this.x, this.y);
        ctx.rotate(this.rotation);

        const r = this.radius;

        if (this.type === 'BOMB') {
            // Demon Bomb Duck
            ctx.fillStyle = '#111';
            ctx.beginPath();
            ctx.ellipse(0, 0, r, r * 0.75, 0, 0, Math.PI * 2);
            ctx.fill();

            ctx.beginPath();
            ctx.arc(r * 0.6, -r * 0.3, r * 0.45, 0, Math.PI * 2);
            ctx.fill();

            // Glowing Demon Crest
            ctx.fillStyle = '#ff0000';
            ctx.shadowBlur = 15;
            ctx.shadowColor = '#ff0000';
            ctx.beginPath();
            ctx.moveTo(r * 0.5, -r * 0.7);
            ctx.lineTo(r * 0.3, -r * 1.3);
            ctx.lineTo(r * 0.7, -r * 0.8);
            ctx.fill();

            // Eyes
            ctx.fillStyle = '#ff0000';
            ctx.beginPath();
            ctx.arc(r * 0.75, -r * 0.4, r * 0.14, 0, Math.PI * 2);
            ctx.fill();
            ctx.shadowBlur = 0;

            // Beak
            ctx.fillStyle = '#222';
            ctx.beginPath();
            ctx.moveTo(r * 0.95, -r * 0.35);
            ctx.lineTo(r * 1.4, -r * 0.25);
            ctx.lineTo(r * 0.95, -r * 0.15);
            ctx.fill();
        } else {
            let bodyColor1 = '#fff275', bodyColor2 = '#e1b12c';
            let wingColor = '#d49e1a';

            if (this.type === 'GOLDEN') {
                bodyColor1 = '#ffeaa7';
                bodyColor2 = '#fdcb6e';
                wingColor = '#e17055';
            } else if (this.type === 'ZOMBIE') {
                bodyColor1 = '#78e08f';
                bodyColor2 = '#38ada9';
                wingColor = '#079992';
            }

            let grad = ctx.createRadialGradient(0, 0, 5, 0, 0, r);
            grad.addColorStop(0, bodyColor1);
            grad.addColorStop(1, bodyColor2);

            ctx.fillStyle = grad;
            ctx.beginPath();
            ctx.ellipse(0, 0, r, r * 0.7, 0, 0, Math.PI * 2);
            ctx.fill();

            // Wing
            ctx.fillStyle = wingColor;
            ctx.beginPath();
            ctx.ellipse(-r * 0.2, r * 0.05, r * 0.5, r * 0.3, -0.2, 0, Math.PI * 2);
            ctx.fill();

            // Head
            ctx.beginPath();
            ctx.arc(r * 0.55, -r * 0.35, r * 0.42, 0, Math.PI * 2);
            ctx.fill();

            // Eye
            ctx.fillStyle = this.type === 'ZOMBIE' ? '#ff0000' : '#1a1a1a';
            ctx.beginPath();
            ctx.arc(r * 0.7, -r * 0.42, r * 0.09, 0, Math.PI * 2);
            ctx.fill();

            // Beak
            ctx.fillStyle = '#ff793f';
            ctx.beginPath();
            ctx.moveTo(r * 0.88, -r * 0.4);
            ctx.lineTo(r * 1.35, -r * 0.3);
            ctx.lineTo(r * 0.88, -r * 0.18);
            ctx.fill();
        }

        ctx.restore();
    }
}

// --- SLICED DUCK HALVES ---
class SlicedHalf {
    constructor(x, y, radius, isTop, type) {
        this.x = x;
        this.y = y;
        this.radius = radius;
        this.isTop = isTop;
        this.type = type;
        this.vx = (Math.random() - 0.5) * 8 + (isTop ? -3 : 3);
        this.vy = (Math.random() - 0.5) * 5 - 2;
        this.gravity = canvas.height * 0.0006;
        this.rotation = 0;
        this.vRot = (Math.random() - 0.5) * 0.2;
        this.alpha = 1;
    }

    update() {
        this.x += this.vx;
        this.y += this.vy;
        this.vy += this.gravity;
        this.rotation += this.vRot;
        this.alpha -= 0.015;
    }

    draw() {
        ctx.save();
        ctx.globalAlpha = Math.max(0, this.alpha);
        ctx.translate(this.x, this.y);
        ctx.rotate(this.rotation);

        const r = this.radius;
        ctx.fillStyle = this.type === 'ZOMBIE' ? '#38ada9' : (this.type === 'GOLDEN' ? '#fdcb6e' : '#e1b12c');

        ctx.beginPath();
        if (this.isTop) {
            ctx.arc(0, 0, r * 0.7, Math.PI, 0);
        } else {
            ctx.arc(0, 0, r * 0.7, 0, Math.PI);
        }
        ctx.fill();

        ctx.restore();
    }
}

// --- PARTICLES, SPARKS & FLOATING TEXTS ---
class Particle {
    constructor(x, y, color, speedMultiplier = 1) {
        this.x = x;
        this.y = y;
        this.color = color;
        this.radius = Math.random() * (canvas.width * 0.008) + 2;
        this.vx = (Math.random() - 0.5) * (canvas.width * 0.02) * speedMultiplier;
        this.vy = (Math.random() - 0.5) * (canvas.height * 0.02) * speedMultiplier;
        this.gravity = canvas.height * 0.0004;
        this.alpha = 1;
    }

    update() {
        this.x += this.vx;
        this.y += this.vy;
        this.vy += this.gravity;
        this.alpha -= 0.02;
    }

    draw() {
        ctx.save();
        ctx.globalAlpha = Math.max(0, this.alpha);
        ctx.fillStyle = this.color;
        ctx.beginPath();
        ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
    }
}

class BladeSpark {
    constructor(x, y, color = '#ffffff') {
        this.x = x;
        this.y = y;
        this.color = color;
        this.radius = Math.random() * 4 + 1;
        this.vx = (Math.random() - 0.5) * 5;
        this.vy = (Math.random() - 0.5) * 5;
        this.alpha = 1;
    }
    update() {
        this.x += this.vx;
        this.y += this.vy;
        this.alpha -= 0.06;
    }
    draw() {
        ctx.save();
        ctx.globalAlpha = Math.max(0, this.alpha);
        ctx.fillStyle = this.color;
        ctx.shadowBlur = 10;
        ctx.shadowColor = this.color;
        ctx.beginPath();
        ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
    }
}

class DrippingSplatter {
    constructor(x, y, isHuge = false) {
        this.x = x;
        this.y = y;
        this.radius = (Math.random() * 20 + 15) * (isHuge ? 2.5 : 1);
        this.color = '#7a0000';
        this.drips = [];
        
        const numDrips = Math.floor(Math.random() * 4) + 1;
        for (let i = 0; i < numDrips; i++) {
            this.drips.push({
                offsetX: (Math.random() - 0.5) * (this.radius * 1.3),
                length: 0,
                maxLength: Math.random() * (isHuge ? 160 : 90) + 20,
                speed: Math.random() * 1.8 + 0.5,
                width: Math.random() * 4 + 2
            });
        }
    }

    update() {
        this.drips.forEach(d => {
            if (d.length < d.maxLength) {
                d.length += d.speed;
            }
        });
    }

    draw() {
        ctx.save();
        ctx.fillStyle = this.color;

        ctx.beginPath();
        ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
        ctx.fill();

        this.drips.forEach(d => {
            ctx.beginPath();
            ctx.rect(this.x + d.offsetX, this.y, d.width, d.length);
            ctx.fill();

            ctx.beginPath();
            ctx.arc(this.x + d.offsetX + d.width / 2, this.y + d.length, d.width * 1.2, 0, Math.PI * 2);
            ctx.fill();
        });

        ctx.restore();
    }
}

class FloatingText {
    constructor(x, y, text, color = '#ff0055') {
        this.x = x;
        this.y = y;
        this.text = text;
        this.color = color;
        this.alpha = 1;
        this.scale = 1.4;
    }
    update() {
        this.y -= 2;
        this.alpha -= 0.025;
        this.scale = Math.max(1, this.scale - 0.02);
    }
    draw() {
        ctx.save();
        ctx.globalAlpha = Math.max(0, this.alpha);
        ctx.fillStyle = this.color;
        ctx.font = `900 ${Math.floor(24 * this.scale)}px sans-serif`;
        ctx.shadowBlur = 10;
        ctx.shadowColor = '#000';
        ctx.fillText(this.text, this.x, this.y);
        ctx.restore();
    }
}

// --- ACCURATE INPUT & SWIPE TRACKING ---
function trackPointer(clientX, clientY) {
    const rect = canvas.getBoundingClientRect();
    const x = clientX - rect.left;
    const y = clientY - rect.top;
    bladeTrail.push({ x, y, time: Date.now() });

    bladeSparks.push(new BladeSpark(x, y));
}

window.addEventListener('mousemove', (e) => trackPointer(e.clientX, e.clientY));
window.addEventListener('touchmove', (e) => {
    for (let i = 0; i < e.touches.length; i++) {
        trackPointer(e.touches[i].clientX, e.touches[i].clientY);
    }
    e.preventDefault();
}, { passive: false });

window.addEventListener('touchstart', (e) => {
    for (let i = 0; i < e.touches.length; i++) {
        trackPointer(e.touches[i].clientX, e.touches[i].clientY);
    }
}, { passive: false });

// --- SWIPE COLLISION & COMBO LOGIC ---
function checkSlices() {
    if (bladeTrail.length < 2) return;

    let slicesInFrame = 0;

    for (let j = 1; j < bladeTrail.length; j++) {
        const p1 = bladeTrail[j - 1];
        const p2 = bladeTrail[j];

        if (p2.time - p1.time > 60) continue;

        for (let i = ducks.length - 1; i >= 0; i--) {
            const d = ducks[i];
            const dist = distToSegment(d, p1, p2);

            if (dist < d.radius * 1.2) {
                if (d.type === 'BOMB') {
                    triggerExplosion(d.x, d.y);
                    endGame();
                } else if (d.type === 'ZOMBIE' && d.health > 1) {
                    d.health--;
                    particles.push(new Particle(d.x, d.y, '#38ada9', 1.5));
                    floatingTexts.push(new FloatingText(d.x, d.y, 'HIT!', '#00ffcc'));
                } else {
                    sliceDuck(d);
                    ducks.splice(i, 1);
                    slicesInFrame++;
                }
            }
        }
    }

    if (slicesInFrame > 1) {
        const lastP = bladeTrail[bladeTrail.length - 1];
        floatingTexts.push(new FloatingText(lastP.x, lastP.y, `${slicesInFrame}x COMBO!`, '#ffea00'));
    }
}

function sliceDuck(d) {
    let points = 10;
    let bloodColor = '#aa0000';

    if (d.type === 'GOLDEN') {
        points = 50;
        bloodColor = '#ffd700';
        floatingTexts.push(new FloatingText(d.x, d.y, '+50 GOLDEN!', '#ffd700'));
    } else if (d.type === 'ZOMBIE') {
        points = 25;
        bloodColor = '#1e3799';
    }

    score += points;
    scoreEl.innerText = score;

    splatters.push(new DrippingSplatter(d.x, d.y, false));
    if (splatters.length > 30) splatters.shift();

    slicedHalves.push(new SlicedHalf(d.x, d.y, d.radius, true, d.type));
    slicedHalves.push(new SlicedHalf(d.x, d.y, d.radius, false, d.type));

    for (let i = 0; i < 35; i++) {
        particles.push(new Particle(d.x, d.y, bloodColor));
    }
}

function triggerExplosion(x, y) {
    shakeTime = 20; // Screen Shake intensity
    for (let i = 0; i < 8; i++) {
        splatters.push(new DrippingSplatter(
            x + (Math.random() - 0.5) * canvas.width * 0.4, 
            y + (Math.random() - 0.5) * canvas.height * 0.4, 
            true
        ));
    }
    for (let i = 0; i < 250; i++) {
        particles.push(new Particle(x, y, '#ff0000', 3));
    }
}

function distToSegment(p, v, w) {
    const l2 = (w.x - v.x) ** 2 + (w.y - v.y) ** 2;
    if (l2 === 0) return Math.hypot(p.x - v.x, p.y - v.y);
    let t = ((p.x - v.x) * (w.x - v.x) + (p.y - v.y) * (w.y - v.y)) / l2;
    t = Math.max(0, Math.min(1, t));
    return Math.hypot(p.x - (v.x + t * (w.x - v.x)), p.y - (v.y + t * (w.y - v.y)));
}

// --- GAME LOOP ---
function animate() {
    if (!gameOver) {
        ctx.save();
        
        // Handle Camera Shake
        if (shakeTime > 0) {
            const dx = (Math.random() - 0.5) * 18;
            const dy = (Math.random() - 0.5) * 18;
            ctx.translate(dx, dy);
            shakeTime--;
        }

        ctx.clearRect(0, 0, canvas.width, canvas.height);

        // Persistent blood drips
        splatters.forEach(s => {
            s.update();
            s.draw();
        });

        // Spawn Ducks dynamically
        spawnTimer++;
        if (spawnTimer % 40 === 0) {
            ducks.push(new Duck());
        }

        // Update & Draw Sliced Halves
        for (let i = slicedHalves.length - 1; i >= 0; i--) {
            slicedHalves[i].update();
            slicedHalves[i].draw();
            if (slicedHalves[i].alpha <= 0) slicedHalves.splice(i, 1);
        }

        // Update & Draw Ducks
        for (let i = ducks.length - 1; i >= 0; i--) {
            ducks[i].update();
            ducks[i].draw();
            if (ducks[i].y > canvas.height + 100 && ducks[i].vy > 0) {
                ducks.splice(i, 1);
            }
        }

        // Update & Draw Spray Particles
        for (let i = particles.length - 1; i >= 0; i--) {
            particles[i].update();
            particles[i].draw();
            if (particles[i].alpha <= 0) particles.splice(i, 1);
        }

        // Update & Draw Blade Sparks
        for (let i = bladeSparks.length - 1; i >= 0; i--) {
            bladeSparks[i].update();
            bladeSparks[i].draw();
            if (bladeSparks[i].alpha <= 0) bladeSparks.splice(i, 1);
        }

        // Update & Draw Floating Combo/Score Text
        for (let i = floatingTexts.length - 1; i >= 0; i--) {
            floatingTexts[i].update();
            floatingTexts[i].draw();
            if (floatingTexts[i].alpha <= 0) floatingTexts.splice(i, 1);
        }

        // --- ENHANCED SWORD TRAIL ---
        const now = Date.now();
        bladeTrail = bladeTrail.filter(p => now - p.time < 180);

        if (bladeTrail.length > 1) {
            const maxLineWidth = Math.max(12, canvas.width * 0.018);

            for (let i = 1; i < bladeTrail.length; i++) {
                const ratio = i / bladeTrail.length;
                const p1 = bladeTrail[i - 1];
                const p2 = bladeTrail[i];

                ctx.beginPath();
                ctx.moveTo(p1.x, p1.y);
                ctx.lineTo(p2.x, p2.y);
                ctx.strokeStyle = `rgba(255, 0, 85, ${ratio})`;
                ctx.lineWidth = maxLineWidth * ratio;
                ctx.lineCap = 'round';
                ctx.lineJoin = 'round';
                ctx.shadowBlur = 20;
                ctx.shadowColor = '#ff0033';
                ctx.stroke();
            }

            for (let i = 1; i < bladeTrail.length; i++) {
                const ratio = i / bladeTrail.length;
                const p1 = bladeTrail[i - 1];
                const p2 = bladeTrail[i];

                ctx.beginPath();
                ctx.moveTo(p1.x, p1.y);
                ctx.lineTo(p2.x, p2.y);
                ctx.strokeStyle = `rgba(255, 255, 255, ${ratio})`;
                ctx.lineWidth = (maxLineWidth * 0.35) * ratio;
                ctx.lineCap = 'round';
                ctx.lineJoin = 'round';
                ctx.shadowBlur = 0;
                ctx.stroke();
            }
        }

        checkSlices();
        ctx.restore();
        requestAnimationFrame(animate);
    }
}

// --- GAME OVER & RESTART ---
function endGame() {
    gameOver = true;
    bloodOverlay.style.opacity = '1';
    finalScoreEl.innerText = score;

    setTimeout(() => {
        gameOverScreen.style.display = 'flex';
    }, 250);
}

function restartGame() {
    gameOver = false;
    score = 0;
    scoreEl.innerText = score;
    ducks = [];
    slicedHalves = [];
    particles = [];
    bladeSparks = [];
    splatters = [];
    bladeTrail = [];
    floatingTexts = [];
    bloodOverlay.style.opacity = '0';
    gameOverScreen.style.display = 'none';
    animate();
}

function shareScore() {
    const shareText = `💀 I slaughtered ducks to score ${score} points in Duck Ninja! Can you survive?`;
    
    if (navigator.share) {
        navigator.share({
            title: 'Duck Ninja High Score',
            text: shareText,
            url: window.location.href
        }).catch(() => {});
    } else {
        navigator.clipboard.writeText(shareText);
        alert('Score copied to clipboard! Share your carnage everywhere:\n\n' + shareText);
    }
}

// Start Game
animate();
</script>
